name: Sanitize
on:
  pull_request:
  workflow_dispatch:
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Check changed published files
        run: |
          set -euo pipefail
          # The file list is every type any of the four sites can publish, and
          # is deliberately identical in all three repos rather than tailored
          # to each. A `*.md` filter is what this replaces: cv publishes
          # index.html and the hub publishes src/pages/index.astro, so their
          # only markdown is CLAUDE.md / README.md / ROADMAP.md and every real
          # content pull request passed green having read nothing at all.
          # A repo simply has none of the types it does not use.
          #
          # -z and stdin, never `tr '\n' ' '` into an unquoted expansion: 97 of
          # the garden's 110 notes have spaces in their names, and word-splitting
          # one turns a content check into `cannot read about:` and exit 2 --
          # a plumbing failure wearing a sanitizer's error message.
          types=( '*.md' '*.base' '*.html' '*.astro' '*.css' '*.scss'
                  '*.js' '*.mjs' '*.ts' '*.tsx' '*.json' )
          list="$RUNNER_TEMP/changed.z"

          base='${{ github.event.pull_request.base.sha }}'
          if [ -n "$base" ]; then
            # base.sha, not origin/$base_ref: fetch-depth 0 gets the history but
            # not necessarily the base branch ref, and `unknown revision` under
            # `set -e` reads as a sanitize failure rather than a plumbing one.
            git diff --name-only --diff-filter=d -z "$base"...HEAD -- "${types[@]}" > "$list"
          else
            # workflow_dispatch: no pull request, so sweep everything the repo
            # publishes. Proving the gate can go red never proved that existing
            # content passes it; this is the run that does.
            git ls-files -z -- "${types[@]}" > "$list"
          fi

          # An empty list is a legitimate pass -- a pull request touching only
          # images or workflow files really has nothing here to check.
          if [ ! -s "$list" ]; then
            echo "no publishable file changed"
            exit 0
          fi

          python .github/scripts/public_check.py \
            --allowlist .github/scripts/frontmatter_allowlist.json -0 < "$list"

      - name: Check changed images for GPS metadata
        # Runs even when the text step above went red. The two gates are
        # independent and a check hidden behind another check's failure is a
        # check nobody sees -- the garden's text step is red today on the
        # already-published `areas`/`related` keys, which would otherwise mean
        # its images were never examined at all. The job still fails if either
        # step does.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # A SEPARATE step with its own list, deliberately. These paths must
          # not join the array above: public_check.py `read_text()`s every path
          # it is handed and a JPEG exits 2 on UnicodeDecodeError -- a plumbing
          # failure wearing a sanitizer's error message.
          #
          # 17 of this hub's 26 photos carried a full GPS IFD for four months
          # because `location` was a blocking policy category with no
          # enforcement path into the one medium that carries locations by
          # default. image_check.py asserts an ABSENCE, so unlike the identity
          # rules it is safe to run in a public repo.
          #
          # :(icase) because cameras write .JPG and git pathspecs are
          # case-sensitive on the Linux runner.
          image_types=( ':(icase)*.jpg' ':(icase)*.jpeg' ':(icase)*.png'
                        ':(icase)*.tif' ':(icase)*.tiff' ':(icase)*.heic'
                        ':(icase)*.webp' )
          list="$RUNNER_TEMP/changed-images.z"

          base='${{ github.event.pull_request.base.sha }}'
          if [ -n "$base" ]; then
            git diff --name-only --diff-filter=d -z "$base"...HEAD -- "${image_types[@]}" > "$list"
          else
            # workflow_dispatch: sweep every image the repo ships, which is the
            # run that proves the existing set is clean rather than untouched.
            git ls-files -z -- "${image_types[@]}" > "$list"
          fi

          if [ ! -s "$list" ]; then
            echo "no image changed"
            exit 0
          fi

          python .github/scripts/image_check.py -0 < "$list"
